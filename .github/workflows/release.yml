name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'  # Trigger on tags starting with 'v' (e.g., v1.0.0)

jobs:
  release:
    name: Build and Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Grant execute permission for Gradle wrapper
        run: cd android && chmod +x ./gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testReleaseUnitTest

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "SIGNING_KEYSTORE_BASE64 secret not set. Generating dummy release keystore for build validation."
            keytool -genkeypair \
              -alias "release-key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore android/app/release.keystore \
              -storepass "a3e5e5c8b7c020a4841d64d4358ce10b" \
              -keypass "a3e5e5c8b7c020a4841d64d4358ce10b" \
              -dname "CN=Dummy, O=Dummy, C=US"
          fi

      - name: Setup local.properties with signing config
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          echo "signing.storeFilePath=release.keystore" >> android/local.properties
          echo "signing.storePassword=${STORE_PASSWORD:-a3e5e5c8b7c020a4841d64d4358ce10b}" >> android/local.properties
          echo "signing.keyAlias=${KEY_ALIAS:-release-key}" >> android/local.properties
          echo "signing.keyPassword=${KEY_PASSWORD:-a3e5e5c8b7c020a4841d64d4358ce10b}" >> android/local.properties

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/MissionTrackerMap-release.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
